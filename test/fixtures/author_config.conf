unbind-key "C-b"
set-option -g prefix "C-s"
bind-key "C-s" send-prefix
bind-key "s" split-window -v -c "#{pane_current_path}"
bind-key "v" split-window -h -c "#{pane_current_path}"
bind-key "C-s" split-window -v -c "#{pane_current_path}"
bind-key "C-v" split-window -h -c "#{pane_current_path}"
bind-key "\"" split-window -c "#{pane_current_path}"
bind-key "%" split-window -h -c "#{pane_current_path}"
bind-key "@" split-window -h -c "#{pane_current_path}" -p 33 \; select-pane -L
bind-key "h" select-pane -L
bind-key "C-h" select-pane -L
bind-key "j" select-pane -D
bind-key "C-j" select-pane -D
bind-key "k" select-pane -U
bind-key "C-k" select-pane -U
bind-key "l" select-pane -R
bind-key "C-l" select-pane -R
bind-key -r "<" resize-pane -L 10
bind-key -r ">" resize-pane -R 10
bind-key -r "-" resize-pane -D 10
bind-key -r "+" resize-pane -U 10
bind-key "=" select-layout tiled
bind-key ":" command-prompt
bind-key "C" new-session
bind-key "L" choose-session
bind-key "R" move-window -r
bind-key "C-a" last-window
bind-key "`" last-window
bind-key "K" confirm kill-server
bind-key "X" confirm kill-window
bind-key "P" choose-buffer -Z
set-option -gw mode-keys "vi"
set-option -g base-index 1
set-option -s escape-time 0
set-option -g history-limit 10000
set-option -s focus-events on
set-option -g update-environment "DISPLAY WINDOWID SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION"
%if '#{<:#{version},2.9}'
set-option -g status-bg "default"
set-option -g status-fg "white"
%endif
%if '#{>=:#{version},2.9}'
set-option -g status-style "bg=terminal,fg=white"
%endif
set-option -g status-position "top"
set-option -g status-left-length 100
set-option -g status-right-length 100
%if '#{<:#{version},2.9}'
set-option -g status-left-bg "default"
set-option -g status-left-fg "white"
set-option -g status-left-attr "none"
%endif
%if '#{>=:#{version},2.9}'
set-option -g status-left-style "bg=default,fg=white,none"
%endif
set-option -g status-left "#[fg=#2d2d30,bg=#{?client_prefix,#ff8800,#{?pane_in_mode,#6a9955,#2d2d30}}] #[fg=#{?client_prefix,#ff8800,#{?pane_in_mode,#6a9955,#2d2d30}},bg=default]"
set-option -g status-right "#{?window_zoomed_flag,#[fg=#ffffff#,bg=default]#[fg=#000000#,bg=#ffffff#,bold] Z #[nobold]#[fg=#ffffff#,bg=default#,reverse]#[noreverse],}#{?pane_in_mode,#[fg=#6a9955#,bg=default]#[fg=#000000#,bg=#6a9955] #{pane_mode} #[fg=#6a9955#,bg=default#,reverse]#[noreverse],}#[fg=#2d2d30,bg=default]#[fg=#ffffff,bg=#2d2d30] #{s|<home>/|~/|:pane_current_path} #[fg=#3a3a3a,bg=#2d2d30]#[fg=#ffffff,bg=#3a3a3a] #{pane_current_command} #[fg=#5eaceb,bg=#3a3a3a]#[fg=#000000,bg=#5eaceb,bold] #S@#H #[nobold]#[fg=#000000,bg=#5eaceb]#[fg=#2d2d30,bg=#000000]#[fg=#{?client_prefix,#ff8800,#{?pane_in_mode,#6a9955,#2d2d30}},bg=#000000]#[fg=#2d2d30,bg=#{?client_prefix,#ff8800,#{?pane_in_mode,#6a9955,#2d2d30}}] "
set-option -gw window-status-format "#[fg=#2d2d30,bg=#5eaceb] #I #[fg=#5eaceb,bg=#2d2d30]#{?#{==:#{@pmux_flash_window},on},#[fg=colour235#,bg=cyan],}#{?#{?@ai_attn_window_state,0,1}, ,}#{?#{==:#{@pmux_flash_window},on},#{s|##\\[[^]]*\\]||:@ai_attn_window_segment},#{E:@ai_attn_window_segment}}#{?#{==:#{@pmux_flash_window},on},#[fg=colour235#,bg=cyan],#{?#{?#{&&:#{@ai_attn_window_flash},#{@ai_attn_flash_phase}},0,1},#[fg=#5eaceb#,bg=#2d2d30],}}#{?window_zoomed_flag,#{?#{?#{||:#{&&:#{@ai_attn_window_flash},#{@ai_attn_flash_phase}},#{==:#{@pmux_flash_window},on}},0,1},#[fg=colour44],}(#W),#W} #{?pane_synchronized,#[fg=brightred](sync) ,}#[default]"
set-option -gw window-status-current-format "#[fg=#000000,bg=#ff8800] #I #[fg=#ffffff,bg=#4e4e4e]#{?#{==:#{@pmux_flash_window},on},#[fg=colour235#,bg=cyan],}#{?#{?@ai_attn_window_state,0,1}, ,}#{?#{==:#{@pmux_flash_window},on},#{s|##\\[[^]]*\\]||:@ai_attn_window_segment},#{E:@ai_attn_window_segment}}#{?#{==:#{@pmux_flash_window},on},#[fg=colour235#,bg=cyan],#{?#{?#{&&:#{@ai_attn_window_flash},#{@ai_attn_flash_phase}},0,1},#[fg=#ffffff#,bg=#4e4e4e],}}#{?window_zoomed_flag,#{?#{?#{||:#{&&:#{@ai_attn_window_flash},#{@ai_attn_flash_phase}},#{==:#{@pmux_flash_window},on}},0,1},#[fg=colour44],}(#W),#W} #{?pane_synchronized,#[fg=brightred](sync) ,}#[default]"
%if '#{<:#{version},2.9}'
set-option -gw window-status-bg "default"
set-option -gw window-status-fg "white"
set-option -gw window-status-attr "none"
set-option -gw window-status-current-attr "none"
%endif
%if '#{>=:#{version},2.9}'
set-option -gw window-status-style "bg=#2d2d30,fg=#5eaceb,none"
set-option -gw window-status-current-style "bg=#4e4e4e,fg=#ffffff,none"
%endif
%if '#{<:#{version},2.9}'
set-option -gw pane-border-bg "default"
set-option -gw pane-border-fg "colour238"
set-option -gw pane-active-border-bg "default"
set-option -gw pane-active-border-fg "colour214"
%endif
%if '#{>=:#{version},2.9}'
set-option -gw pane-border-style "bg=default,fg=colour238"
set-option -gw pane-active-border-style "bg=default,fg=colour214"
%endif
set-option -s default-terminal "screen-256color"
if-shell "infocmp tmux-256color >/dev/null 2>&1" {
  set-option -s default-terminal "tmux-256color"
} {
  set-option -s default-terminal "screen-256color"
}
set-option -sa terminal-overrides ",xterm*:sitm=\\E[3m"
%if '#{>=:#{version},2.1}'
set-option -g mouse off
%endif
%if '#{<:#{version},2.1}'
set-option -gw mode-mouse off
set-option -g mouse-resize-pane off
set-option -g mouse-select-pane off
set-option -g mouse-select-window off
%endif
%if '#{<:#{version},2.1}'
bind-key "m" set -g mode-mouse on \; set -g -T prefixmouse-resize-pane on \; set -g mouse-select-pane on \; set -g mouse-select-window on \; display 'Mouse: ON'
bind-key "M" set -g mode-mouse off \; set -g mouse-resize-pane off \; set -g mouse-select-pane off \; set -g mouse-select-window off \; display 'Mouse: OFF'
%endif
%if '#{>=:#{version},2.1}'
bind-key "m" set -g mouse on \; display 'Mouse: ON'
bind-key "M" set -g mouse off \; display 'Mouse: OFF'
%endif
bind-key "r" run-shell "tmux.rb load -S \"#{socket_path}\" <repository>/examples/author_config.rb" \; display-message "Configuration reloaded"
bind-key "N" command-prompt "new-window -n '%%' -c '#{pane_current_path}'"
bind-key "c" new-window -c '#{pane_current_path}'
bind-key "B" confirm-before -p "Change prefix to C-b?" 'set -g prefix ^b'
bind-key "A" confirm-before -p "Change prefix to C-a?" 'set -g prefix ^a'
bind-key "F" confirm-before -p "Change prefix to C-s?" 'set -g prefix ^s'
bind-key "S" command-prompt -p 'save history to filename:' -I '/tmp/tmux.history' 'capture-pane -S -32768 ; save-buffer %1 ; delete-buffer'
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "e" run-shell -b '"$HOME/.local/bin/pmux" equalize-panes "#{pane_id}" --socket "#{socket_path}"'
bind-key "E" select-layout even-vertical
bind-key -T "copy-mode-vi" "v" send-keys -X begin-selection
bind-key -T "copy-mode-vi" "C-v" send-keys -X rectangle-toggle
bind-key -T "copy-mode" "C-v" send-keys -X rectangle-toggle
bind-key -T "copy-mode-vi" "y" send-keys -X copy-selection-and-cancel
set-option -gw pane-base-index 1
set-option -g renumber-windows on
set-option -g @plugin "tmux-plugins/tpm"
set-option -g @plugin "tmux-plugins/tmux-pain-control"
set-option -g @plugin "tmux-plugins/tmux-sensible"
set-option -g @plugin "tmux-plugins/tmux-logging"
set-option -g @plugin "christoomey/vim-tmux-navigator"
set-option -g @plugin "jimeh/tmuxifier"
set-option -g @plugin "tmux-plugins/tmux-yank"
set-option -g @plugin "alexwforsythe/tmux-which-key"
set-option -g @plugin "tmux-plugins/tmux-resurrect"
set-option -g @plugin "cosmicbuffalo/tmux-ai-attn"
set-option -g @ai_attn_flash_multiplier 8
set-option -g @ai_attn_color_text_fg "default"
set-option -g @ai_attn_seen_flash_seconds 30
set-option -g @resurrect-save "Z"
set-option -g @resurrect-restore "R"
set-option -g @yank_action "copy-pipe-no-clear"
set-option -s set-clipboard on
set-option -sa terminal-overrides ",*:clipboard:external"
set-option -g mouse on
set-option -gw mode-keys "vi"
set-option -gw xterm-keys on
set-option -s default-terminal "xterm-256color"
set-option -sa terminal-features ",*:RGB"
set-option -gw pane-active-border-style "fg=#ff8800"
set-option -gw pane-border-style "fg=#2d2d30"
set-option -gw pane-border-lines "heavy"
set-option -gw pane-border-status "top"
set-option -gw pane-border-format "#[fg=#{?pane_active,#ff8800,#ffffff}] #{?#{m/r:^(bash|dash|fish|ksh|sh|tcsh|zsh)$,#{pane_current_command}},#{pane_current_command},#{s|<home>/|~/|:pane_current_path}} #[default]#[align=right]#[fg=#{?#{==:#{@pmux_flash_pane},on},cyan,#{?#{==:#{@pmux_flash_pane},off},#2d2d30,#{?pane_active,#ff8800,#2d2d30}}},bg=default]#[fg=#{?#{==:#{@pmux_flash_pane},on},colour235,#{?#{==:#{@pmux_flash_pane},off},white,#{?pane_active,colour235,white}}},bg=#{?#{==:#{@pmux_flash_pane},on},cyan,#{?#{==:#{@pmux_flash_pane},off},#2d2d30,#{?pane_active,#ff8800,#2d2d30}}}] #{pane_index} #[fg=#{?#{==:#{@pmux_flash_pane},on},cyan,#{?#{==:#{@pmux_flash_pane},off},#2d2d30,#{?pane_active,#ff8800,#2d2d30}}},bg=default]#[default]"
set-option -gw window-style "bg=colour236"
set-option -gw window-active-style "bg=colour234"
set-option -g message-style "bg=#2d2d30,fg=white"
set-option -g message-command-style "bg=colour239,fg=colour223"
%if '#{?#{e|>=:#{?#{m/r:[0-9]+[.][0-9]+,#{version}},#{e|+:#{e|*:#{s/^[^0-9]*([0-9]+)[.]([0-9]+).*$/\1/:version},1000},#{s/^[^0-9]*([0-9]+)[.]([0-9]+).*$/\2/:version}},999999},3008},0,1}'
set-option -g display-panes-active-colour "#ff8800"
set-option -g display-panes-colour "#5eaceb"
%else
set-option -gw display-panes-active-colour "#ff8800"
set-option -gw display-panes-colour "#5eaceb"
%endif
set-option -gw mode-style "bg=#1b2817"
set-option -gw window-status-bell-style "bg=#ff8800,fg=colour235"
run-shell "~/.tmux/plugins/tpm/tpm"
source-file -q "~/.config/pmux/outer-tmux.conf"
if-shell "test -f /usr/local/bin/reattach-to-user-namespace" {
  set-option -g default-command "reattach-to-user-namespace -l zsh"
}
